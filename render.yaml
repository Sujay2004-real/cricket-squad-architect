services:
  - type: web
    name: cricket-squad-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false # Requires manual entry in dashboard for security
      - key: FRONTEND_URL
        sync: false # e.g. https://cricket-squad.netlify.app
